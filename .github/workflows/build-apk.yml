name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/QR-Pro-v1.0.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v1.0.0
          path: release-apk/*.apk

      - name: Automatically Create or Update Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "QR Pro - Version 1.0.0"
          body: |
            ## 📱 QR Pro - Release v1.0.0
            
            ### ✨ ما تم إنجازه في هذا الإصدار:
            - **إقلاع فوري:** فتح مباشر لواجهة التطبيق بدون شاشات زرقاء أو تأخير.
            - **أيقونة مخصصة ومحسنة:** ضبط وتوسيط الأيقونة لتناسب كافة شاشات أندرويد الحديثة.
            - **قارئ ومولد الباركود و QR:** أداء سريع ودقيق مع حفظ السجل والتصدير.
            - **تصميم Material 3:** واجهة عصرية داكنة بتأثيرات بصرية متناسقة.
            
            📥 **حمل ملف الـ APK المرفق أدناه وثبته على هاتفك مباشرة!**
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
