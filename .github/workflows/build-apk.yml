name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release-apk/QR-Pro-v1.1.2.apk
            ls -lh release-apk/QR-Pro-v1.1.2.apk
          else
            echo "Error: No APK file found in app/build/outputs/apk!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v1.1.2
          path: release-apk/*.apk

      - name: Automatically Create or Update Release v1.1.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: "QR Pro - Version 1.1.2"
          body: |
            ## 📱 QR Pro - Release v1.1.2
            
            ### ✨ تحديثات واستقرار هذا الإصدار:
            - **إصلاح جذري للأيقونة وشاشة البداية (Splash Screen):** ضبط الـ Adaptive Icons ومراجع الـ Drawables بالكامل لتعمل بدقة فائقة وبدون أي كراش عند الفتح.
            - **إصلاح ملف الـ Workflow للبناء الآلي:** معالجة مفاتيح التوقيع واستخراج حزمة الـ APK بشكل سليم 100% ومتوافق مع جميع الهواتف.
            - **التثبيت والتحديث المباشر:** إمكانية تنزيل وتثبيت التحديثات مباشرة من داخل التطبيق دون فتح المتصفح.
            - **الترقية للإصدار 1.1.2 (versionCode 4).**
            
            📥 **حمل ملف الـ APK المرفق أدناه وثبته على هاتفك مباشرة!**
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
